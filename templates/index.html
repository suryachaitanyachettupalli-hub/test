<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastAPI Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f5f7ff;
            display: none;
        }

        .result h3 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .status {
            color: green;
            font-size: 14px;
            margin-top: 8px;
        }

        .footer {
            margin-top: 25px;
            color: #aaa;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="icon">⚡</div>

        <h1>FastAPI Dashboard</h1>

        <p class="subtitle">
            HTML + CSS + JavaScript + FastAPI
        </p>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <button onclick="sendRequest()">
            Connect to FastAPI
        </button>

        <div class="result" id="result">

            <h3 id="message"></h3>

            <p class="status" id="status"></p>

        </div>

        <div class="footer">
            Powered by FastAPI 🚀
        </div>

    </div>


    <script>

        async function sendRequest() {

            const name = document.getElementById("name").value;

            if (name.trim() === "") {
                alert("Please enter your name!");
                return;
            }

            try {

                // Call FastAPI
                const response = await fetch(
                    `/api/hello?name=${encodeURIComponent(name)}`
                );

                // Convert response to JSON
                const data = await response.json();

                // Display result
                document.getElementById("message").innerText =
                    data.message;

                document.getElementById("status").innerText =
                    "✓ " + data.status;

                document.getElementById("result").style.display =
                    "block";

            } catch (error) {

                console.error(error);

                document.getElementById("message").innerText =
                    "Something went wrong!";

                document.getElementById("status").innerText =
                    "FastAPI connection failed.";

                document.getElementById("result").style.display =
                    "block";
            }
        }

    </script>

</body>

</html>
